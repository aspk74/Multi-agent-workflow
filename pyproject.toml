[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vendor-risk-matrix"
version = "0.1.0"
description = "Autonomous Vendor Negotiation & Risk Matrix — a production-grade multi-agent system for supply chain risk assessment."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    # LangGraph & LangChain core
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-google-genai>=2.0.0",
    "langchain-pinecone>=0.2.0",

    # FastAPI server
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",

    # Pydantic data validation
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",

    # Environment variable management
    "python-dotenv>=1.0.0",

    # HTTP client (used in mock procurement API)
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",   # TestClient dependency
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]   # FastAPI Depends() calls in function defaults

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
